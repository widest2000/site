name: 국면판 갱신

on:
  schedule:
    # 하루 두 번(형 11-17): 한국장 끝난 뒤 16:45 KST(UTC 07:45, 월~금) · 미국장 끝난 뒤 06:20 KST(UTC 21:20 월~금 = 한국 화~토).
    # 16:45인 까닭: 생성기가 16:40 전에는 그날 한국 봉을 '아직 안 끝남'으로 버린다(수능일 16:30 마감 대비).
    # GitHub 예약은 2026-11 실측 8~10시간 늦게 돌기도 해서, 제시각 갱신은 바깥에서 같은 시각에 수동 실행(workflow_dispatch)으로 깨운다. 바뀐 게 없으면 커밋하지 않는다.
    - cron: "45 7 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", "templates/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 가장 최근 저장소 상태로 맞추기
        run: git fetch origin main && git checkout -B main origin/main
      - name: 계산하고 페이지 만들기
        run: python3 tools/build.py
      - name: 바뀐 게 있으면 올리기
        id: commit
        run: |
          if git diff --quiet -- index.html llms.txt; then
            echo "바뀐 내용 없음 (휴장일이거나 이미 갱신됨)"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html llms.txt data/state.json
            git commit -m "자동 갱신: 한국 $(python3 -c 'import json;d=json.load(open("data/state.json"))["ind"];print(d["kospi"]["date"], "/ 미국", d["spx"]["date"])')"
            git pull --rebase origin main
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 페이지 다시 배포 요청
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
